name: CPU checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked openplatform --help
      - name: Run policy and client in independent SDK environments
        run: |
          for role in client policy; do
            UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/openplatform-$role" uv sync --package openplatform-sdk --locked --no-dev --no-editable
          done
          "$RUNNER_TEMP/openplatform-client/bin/python" tests/policy_acceptance.py \
            --policy-python "$RUNNER_TEMP/openplatform-policy/bin/python"
      - run: uv run --locked pytest
        env:
          OPENPLATFORM_TEST_POLICY_PYTHON: ${{ runner.temp }}/openplatform-policy/bin/python
